image: node:20

stages:
  - test
  - security
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.4 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store
    - node_modules/

lint:
  stage: test
  script:
    - pnpm lint

typecheck:
  stage: test
  script:
    - pnpm typecheck

unit-tests:
  stage: test
  script:
    - pnpm test:coverage

experiment-validate:
  stage: test
  script:
    - pnpm experiment:validate

agent-verify:
  stage: test
  script:
    - test -f AGENTS.md
    - test -f .gitlab/duo/AGENTS.md
    - test -f .gitlab/duo/mr-review-instructions.yaml
    - pnpm typecheck
    - pnpm experiment:validate

security-audit:
  stage: security
  script:
    - pnpm audit --audit-level=high

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

