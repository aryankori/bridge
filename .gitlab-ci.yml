image: node:20

stages:
  - test
  - security
  - build

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.15.4 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store
    - node_modules/

lint:
  stage: test
  script:
    - pnpm lint

typecheck:
  stage: test
  script:
    - pnpm typecheck

unit-tests:
  stage: test
  script:
    - pnpm test:coverage

experiment-validate:
  stage: test
  script:
    - pnpm experiment:validate

security-audit:
  stage: security
  script:
    - pnpm audit --audit-level=high

build:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
